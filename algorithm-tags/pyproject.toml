[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-tags"
version = "1.0.0"
description = "Classification multilabel d'énoncés d'algorithmique"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "iterative-stratification==0.1.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
neural = ["torch>=2.4"]
embeddings = ["torch>=2.4", "gensim>=4.4"]
notebooks = ["pandas>=2", "ipykernel", "nbformat", "nbclient"]
dev = ["ruff>=0.9"]

[project.scripts]
algo-tags = "algo_tags.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
