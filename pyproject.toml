[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-tags"
version = "2.1.0"
description = "Multilabel classification of algorithm tags for programming problems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
split = ["iterative-stratification==0.1.9"]
notebooks = ["pandas>=2", "jupyter"]
dev = ["ruff>=0.9"]

[project.scripts]
algo-tags = "algo_tags.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
